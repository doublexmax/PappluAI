name: Training CI

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "requirements-training.txt"
      - "README.md"
      - "TRAINING.md"
      - "RATINGS.md"
      - ".github/workflows/training-ci.yml"
  pull_request: {}
  workflow_dispatch: {}

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check package boundaries
        run: python tools/check_training_architecture.py
      - name: Check evaluator and information state without training dependencies
        run: >-
          python -m unittest -v
          tests.test_evaluate
          tests.test_evaluate_oracle
          tests.test_search_patterns
          tests.test_penalty
          tests.test_execution
          tests.test_atomic_io
          tests.test_environment
          tests.test_multiplayer
          tests.test_information
          tests.test_registry
      - name: Check browser simulator
        run: node --test tests/simulator.test.mjs tests/card_art.test.mjs
      - name: Check command help without training dependencies
        run: |
          python -m src.cli.solo --help
          python -m src.cli.curriculum --help
          python -m src.cli.benchmark --help
          python -m src.cli.arena --help
          python -m src.cli.league --help
          python -m src.cli.improve --help
          python -m src.cli.calibration --help
          python -m src.cli.tournament --help
          python -m src.cli.ratings --help

  training:
    needs: portable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-training.txt
      - run: python -m pip install -r requirements-training.txt
      - name: Run complete Python regression suite
        run: python -m unittest discover -s tests -v
      - name: Check bounded dynamic model lifecycle
        run: python tools/verify_dynamic_model.py --output-dir "${RUNNER_TEMP}/dynamic-model"
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-model-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dynamic-model/**/evidence.json
            ${{ runner.temp }}/dynamic-model/**/rating-report.json
            ${{ runner.temp }}/dynamic-model/**/benchmark.json
