name: Training CI

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "web/**"
      - "requirements-training.txt"
      - "README.md"
      - "TRAINING.md"
      - ".github/workflows/training-ci.yml"
  pull_request: {}
  workflow_dispatch: {}

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check package boundaries
        run: python tools/check_training_architecture.py
      - name: Check evaluator and information state without training dependencies
        run: >-
          python -m unittest -v
          tests.test_evaluate
          tests.test_evaluate_oracle
          tests.test_penalty
          tests.test_atomic_io
          tests.test_environment
          tests.test_multiplayer
          tests.test_information
          tests.test_outcome
          tests.test_features
          tests.test_match_telemetry
          tests.test_reward_cache
          tests.test_training_architecture
          tests.test_train.TestTrainCli
          tests.test_weights_export.TestPortableExport
          tests.test_weights_export.TestReferenceExport
      - name: Check browser simulator
        run: >-
          node --test
          tests/simulator.test.mjs
          tests/card_art.test.mjs
          tests/evaluate.test.mjs
          tests/game_events.test.mjs
          tests/qnet.test.mjs
          tests/ai.test.mjs
          tests/table.test.mjs
      - name: Check command help without training dependencies
        run: |
          python -m src.cli.train --help
          python -m src.cli.evaluate --help
          python -m src.cli.arena --help

  training:
    needs: portable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-training.txt
      - run: python -m pip install -r requirements-training.txt
      - name: Run complete Python regression suite
        run: python -m unittest discover -s tests -v
      - name: Check bounded DMC lifecycle
        run: |
          python -m src.cli.train --output-dir "${RUNNER_TEMP}/dmc" --players 1 2 3 4 --max-turns 2 --round-episodes 4 --batch-size 8 --replay-capacity 128 --validate-every 4 --validation-games 1 --actors 2 --max-episodes 4
          python -m src.cli.train --output-dir "${RUNNER_TEMP}/dmc" --max-episodes 8
          python tools/weights_export.py --checkpoint "${RUNNER_TEMP}/dmc/best-model.pt" --output "${RUNNER_TEMP}/dmc/model.json" --golden "${RUNNER_TEMP}/dmc/golden.json"
          python -m src.cli.evaluate --checkpoint "${RUNNER_TEMP}/dmc/best-model.pt" --games 4 --warm-games 0 --output "${RUNNER_TEMP}/dmc/evaluation.json"
          python -m src.cli.arena --model "${RUNNER_TEMP}/dmc/best-model.pt" --model random --games 4 --max-turns 2 --output "${RUNNER_TEMP}/dmc/arena.json"
          node --test tests/*.test.mjs
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dmc-lifecycle-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dmc/status.json
            ${{ runner.temp }}/dmc/metrics.jsonl
            ${{ runner.temp }}/dmc/evaluation.json
            ${{ runner.temp }}/dmc/arena.json
