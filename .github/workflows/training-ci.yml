name: Training CI

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "web/**"
      - "requirements-training.txt"
      - "README.md"
      - "TRAINING.md"
      - ".github/workflows/training-ci.yml"
  pull_request: {}
  workflow_dispatch: {}

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check package boundaries
        run: python tools/check_training_architecture.py
      - name: Check evaluator and information state without training dependencies
        run: >-
          python -m unittest -v
          tests.test_evaluate
          tests.test_evaluate_oracle
          tests.test_penalty
          tests.test_atomic_io
          tests.test_environment
          tests.test_multiplayer
          tests.test_information
          tests.test_outcome
          tests.test_features
          tests.test_match_telemetry
          tests.test_reward_cache
          tests.test_training_architecture
          tests.test_train.TestTrainCli
      - name: Check browser simulator
        run: >-
          node --test
          tests/simulator.test.mjs
          tests/card_art.test.mjs
          tests/evaluate.test.mjs
          tests/game_events.test.mjs
          tests/ai.test.mjs
          tests/table.test.mjs
      - name: Check command help without training dependencies
        run: |
          python -m src.cli.train --help
          python -m src.cli.evaluate --help
          python -m src.cli.arena --help

  training:
    needs: portable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-training.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -r requirements-training.txt
      - name: Run complete Python regression suite
        run: python -m unittest discover -s tests -v
      - name: Check bounded GameTransformer lifecycle
        run: |
          run="${RUNNER_TEMP}/transformer"
          python -m src.cli.train --output-dir "$run" --players 1 2 3 4 --max-turns 2 --width 32 --layers 2 --heads 4 --ffn 64 --tables 4 --batch-size 4 --batch-decisions 16 --min-buffer-decisions 16 --eval-every 1 --eval-deals 1 --anchor-every 2 --actors 2 --max-updates 1 --max-seconds 90
          python -c 'import json, sys; s = json.load(open(sys.argv[1])); assert (s["status"], s["version"]) == ("max_updates", 1), s' "$run/status.json"
          python -m src.cli.train --output-dir "$run" --max-updates 2 --max-seconds 90
          python -c 'import json, sys; s = json.load(open(sys.argv[1])); assert (s["status"], s["version"]) == ("max_updates", 2), s' "$run/status.json"
          python -m src.cli.train --collect "$run/collected" --model "$run/latest-model.pt" --worker 100 --tables 4 --max-batches 1 --max-seconds 30
          python -c 'import pathlib, sys; assert len(list(pathlib.Path(sys.argv[1]).glob("batch-*.pt"))) == 1' "$run/collected"
          python -m src.cli.evaluate --checkpoint "$run/best-model.pt" --games 4 --warm-games 0 --output "$run/evaluation.json"
          python -m src.cli.arena --model "$run/best-model.pt" --model random --games 4 --max-turns 2 --output "$run/arena.json"
          node --test tests/*.test.mjs
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transformer-lifecycle-${{ github.sha }}
          path: |
            ${{ runner.temp }}/transformer/status.json
            ${{ runner.temp }}/transformer/metrics.jsonl
            ${{ runner.temp }}/transformer/evaluation.json
            ${{ runner.temp }}/transformer/arena.json
