name: Training CI

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/check_training_architecture.py"
      - "tools/training_characterization.py"
      - "requirements-training.txt"
      - "experiments/**"
      - "README.md"
      - "TRAINING.md"
      - ".github/workflows/training-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/check_training_architecture.py"
      - "tools/training_characterization.py"
      - "requirements-training.txt"
      - "experiments/**"
      - "README.md"
      - "TRAINING.md"
      - ".github/workflows/training-ci.yml"
  workflow_dispatch:

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check package boundaries
        run: python tools/check_training_architecture.py
      - name: Check evaluator without training dependencies
        run: >-
          python -m unittest -v
          tests.test_evaluate
          tests.test_evaluate_oracle
      - name: Check browser simulator
        run: node --test tests/simulator.test.mjs tests/card_art.test.mjs
      - name: Check command help without training dependencies
        run: |
          python -m src.cli.solo --help
          python -m src.cli.curriculum --help
          python -m src.cli.benchmark --help
          python -m src.cli.compare --help
          python -m src.cli.arena --help
          python -m src.cli.league --help
          python -m src.cli.improve --help
          python -m src.cli.rule_migration --help

  training:
    needs: portable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-training.txt
      - run: python -m pip install -r requirements-training.txt
      - name: Compare merged baseline and refactor behavior
        run: |
          git worktree add --detach "${RUNNER_TEMP}/baseline" f4adea8efcd929c6c8878ad2a4883c3a00d5d4cb
          python tools/training_characterization.py --layout baseline --source-root "${RUNNER_TEMP}/baseline" --output "${RUNNER_TEMP}/characterization/baseline"
          python tools/training_characterization.py --layout refactor --source-root . --baseline-output "${RUNNER_TEMP}/characterization/baseline" --output "${RUNNER_TEMP}/characterization/refactor"
      - name: Upload characterization evidence
        uses: actions/upload-artifact@v4
        with:
          name: training-characterization
          path: |
            ${{ runner.temp }}/characterization/baseline/result.json
            ${{ runner.temp }}/characterization/refactor/result.json
      - name: Run core training tests
        run: >-
          python -m unittest -v
          tests.test_environment
          tests.test_reward_cache
          tests.test_model
          tests.test_train
          tests.test_long_train
          tests.test_benchmark
      - name: Run league training tests
        run: >-
          python -m unittest -v
          tests.test_multiplayer
          tests.test_arena
          tests.test_registry
          tests.test_promotion
          tests.test_league_train
          tests.test_improve
          tests.test_stock_rule_migration
      - name: Check short trainer checkpoint and evaluation
        run: |
          python -m src.cli.solo --episodes 2 --num-decks 2 --cards-in-hand 3 --required-sequences 1 --max-turns 3 --warm-start-fraction 1 --seed 7 --eval-episodes 1 --eval-seed 1007 --log-every 0 --checkpoint "${RUNNER_TEMP}/smoke.pt"
          python -m src.cli.benchmark --checkpoint "${RUNNER_TEMP}/smoke.pt" --output "${RUNNER_TEMP}/smoke-evaluation.json" --games 1 --warm-games 1
      - name: Check full-hand fresh train and exact resume
        run: |
          python -m src.cli.curriculum --output-dir "${RUNNER_TEMP}/full21" --max-episodes 1 --max-seconds 120 --checkpoint-every 1 --validation-games 1 --validate-every 100 --max-turns 1 --seed 41
          python -m src.cli.curriculum --resume "${RUNNER_TEMP}/full21/latest-state.pt" --output-dir "${RUNNER_TEMP}/full21" --max-episodes 2 --max-seconds 120 --checkpoint-every 1
          python -m src.cli.benchmark --checkpoint "${RUNNER_TEMP}/full21/latest-model.pt" --output "${RUNNER_TEMP}/full21-evaluation.json" --games 1 --warm-games 0
      - name: Check full-hand arena league and improvement CLIs
        run: |
          python -m src.cli.solo --episodes 0 --architecture suit_conv --num-decks 3 --cards-in-hand 21 --required-sequences 5 --max-turns 60 --log-every 0 --checkpoint "${RUNNER_TEMP}/initial-full21.pt"
          python -m src.cli.arena --model "${RUNNER_TEMP}/initial-full21.pt" --model random --games 1 --seed 51 --max-turns 1 --output "${RUNNER_TEMP}/arena.json"
          python -m src.cli.league --initial-model "${RUNNER_TEMP}/initial-full21.pt" --output-dir "${RUNNER_TEMP}/league" --matches 1 --max-seconds 120 --checkpoint-every 1 --seed 52
          python -m src.cli.league --initial-model "${RUNNER_TEMP}/initial-full21.pt" --output-dir "${RUNNER_TEMP}/league" --resume "${RUNNER_TEMP}/league/latest-state.pt" --matches 0 --max-seconds 120 --checkpoint-every 1
          python -m src.cli.improve --initial-model "${RUNNER_TEMP}/initial-full21.pt" --output-dir "${RUNNER_TEMP}/improve" --max-seconds 300 --max-cycles 1 --league-matches 1 --research-episodes 1 --selection-blocks 2 --confirmation-blocks 2 --solo-games 2 --checkpoint-every 1 --seed 53
          python -c 'import json, os, pathlib; root = pathlib.Path(os.environ["RUNNER_TEMP"]); arena = json.loads((root / "arena.json").read_text()); status = json.loads((root / "improve" / "status.json").read_text()); assert arena["config"]["game"]["cards_in_hand"] == 21; assert len(arena["games"]) == 1; assert (root / "league" / "latest-state.pt").is_file(); assert status["completed_cycles"] == 1; assert status["promotions"] == 0'
